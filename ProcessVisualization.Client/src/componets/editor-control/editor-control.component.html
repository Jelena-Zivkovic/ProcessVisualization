<div class="editor-contorl">
  <p-button styleClass="p-button-outlined" *ngIf="hasContole" (click)="contoleRequest()">Take control</p-button>
  <p-button styleClass="p-button-outlined" *ngIf="hasContole" (click)="contoleRequest()">Control request</p-button>
  <p-button styleClass="p-button-outlined" *ngIf="hasContole" (click)="cancelRequest()">Cancel request</p-button>

</div>
